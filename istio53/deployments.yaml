apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-53
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-53
  template:
    metadata:
      labels:
        app: log-output-53
    spec:
      containers:
        - name: log-output
          image: node:22-alpine
          command: ["node", "/app/index.js"]
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: log-output-53-code
---
apiVersion: v1
kind: Service
metadata:
  name: log-output-53
spec:
  selector:
    app: log-output-53
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: node:22-alpine
          command: ["node", "/app/index.js"]
          env:
            - name: GREETING
              value: "Hello from greeter v1"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: greeter-53-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v2
  template:
    metadata:
      labels:
        app: greeter
        version: v2
    spec:
      containers:
        - name: greeter
          image: node:22-alpine
          command: ["node", "/app/index.js"]
          env:
            - name: GREETING
              value: "Hello from greeter v2"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: greeter-53-code
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc
  labels:
    istio.io/use-waypoint: greeter-waypoint
spec:
  selector:
    app: greeter
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v1
spec:
  selector:
    app: greeter
    version: v1
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v2
spec:
  selector:
    app: greeter
    version: v2
  ports:
    - port: 80
      targetPort: 8080
