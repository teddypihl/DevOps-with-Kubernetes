name: Todo Project GitOps

run-name: Deploy ${{ github.event.inputs.release_tag != '' && format('production ({0})', github.event.inputs.release_tag) || github.ref_type == 'tag' && format('production ({0})', github.ref_name) || 'staging' }}

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag for production
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: todo-release
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select environment and version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            git checkout --detach "$SHA"
            TARGET=production
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            SHA="$GITHUB_SHA"
            TARGET=production
          else
            SHA="$GITHUB_SHA"
            TARGET=main
          fi
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and publish application images
        shell: bash
        run: |
          PREFIX="$REGISTRY/$PROJECT_ID/$REPOSITORY"
          for APP in todo-app todo-backend broadcaster; do
            docker build -t "$PREFIX/$APP:$RELEASE_SHA" "./$APP"
            docker push "$PREFIX/$APP:$RELEASE_SHA"
          done

      - name: Checkout separate GitOps repository
        uses: actions/checkout@v4
        with:
          repository: teddypihl/DevOps-with-Kubernetes-gitops
          ref: main
          path: gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          persist-credentials: true

      - name: Select configuration branch
        shell: bash
        run: |
          git -C gitops fetch origin "$TARGET_BRANCH"
          git -C gitops switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Update GitOps image versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/environments/base/kustomization.yaml")
          content = path.read_text()
          sha = os.environ["RELEASE_SHA"]

          for name in ("todo-app", "todo-backend", "broadcaster"):
              pattern = (
                  rf'(- name: {name}\n'
                  rf'\s*newName: [^\n]+\n'
                  rf'\s*newTag: )("[^"]+"|\S+)'
              )
              content, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + f'"{sha}"',
                  content
              )
              if count != 1:
                  raise RuntimeError(f"Image entry missing: {name}")

          path.write_text(content)
          PY

      - name: Push GitOps configuration
        shell: bash
        run: |
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gitops add environments/base/kustomization.yaml

          if ! git -C gitops diff --cached --quiet; then
            git -C gitops commit -m "4.10"
          fi

          git -C gitops push origin "HEAD:$TARGET_BRANCH"
