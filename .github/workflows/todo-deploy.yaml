name: Todo Project GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'todo-app/**'
      - 'todo-backend/**'
      - 'broadcaster/**'
      - '.github/workflows/todo-deploy.yaml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images

jobs:
  build-publish-release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and publish images
        run: |
          PREFIX="$REGISTRY/$PROJECT_ID/$REPOSITORY"
          docker build -t "$PREFIX/todo-app:$GITHUB_SHA" ./todo-app
          docker build -t "$PREFIX/todo-backend:$GITHUB_SHA" ./todo-backend
          docker build -t "$PREFIX/broadcaster:$GITHUB_SHA" ./broadcaster
          docker push "$PREFIX/todo-app:$GITHUB_SHA"
          docker push "$PREFIX/todo-backend:$GITHUB_SHA"
          docker push "$PREFIX/broadcaster:$GITHUB_SHA"

      - name: Update Kustomize image tags
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("kustomization.yaml")
          s = p.read_text()
          sha = os.environ["GITHUB_SHA"]

          for name in ("todo-app", "todo-backend", "broadcaster"):
              pattern = (
                  rf'(- name: {name}\n'
                  rf'\s*newName: [^\n]+\n'
                  rf'\s*newTag: )("[^"]+"|\S+)'
              )
              s, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + f'"{sha}"',
                  s
              )
              if count != 1:
                  raise RuntimeError(f"Cannot update {name}")

          p.write_text(s)
          PY

      - name: Commit release to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Release Todo images $GITHUB_SHA [skip ci]"
          git push origin HEAD:main
