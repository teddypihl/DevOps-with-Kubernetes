name: Todo Project GitOps

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'todo-app/**'
      - 'todo-backend/**'
      - 'broadcaster/**'
      - 'environments/**'
      - '.github/workflows/todo-deploy.yaml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: todo-release
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images

jobs:
  build-publish-release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and publish images
        run: |
          PREFIX="$REGISTRY/$PROJECT_ID/$REPOSITORY"

          for APP in todo-app todo-backend broadcaster; do
            docker build -t "$PREFIX/$APP:$GITHUB_SHA" "./$APP"
            docker push "$PREFIX/$APP:$GITHUB_SHA"
          done

      - name: Prepare release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if git ls-remote --exit-code --heads origin production >/dev/null; then
              git fetch origin production
              git switch -C production origin/production
              git restore --source="$GITHUB_SHA" --staged --worktree .
            else
              git switch -C production "$GITHUB_SHA"
            fi
          else
            git fetch origin main
            git switch -C main origin/main
          fi

      - name: Update image versions
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("environments/base/kustomization.yaml")
          content = path.read_text()
          sha = os.environ["GITHUB_SHA"]

          for name in ("todo-app", "todo-backend", "broadcaster"):
              pattern = (
                  rf'(- name: {name}\n'
                  rf'\s*newName: [^\n]+\n'
                  rf'\s*newTag: )("[^"]+"|\S+)'
              )
              content, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + f'"{sha}"',
                  content
              )
              if count != 1:
                  raise RuntimeError(f"Cannot update image: {name}")

          path.write_text(content)
          PY

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/base/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Release Todo images $GITHUB_SHA [skip ci]"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git push origin HEAD:production
          else
            git push origin HEAD:main
          fi
