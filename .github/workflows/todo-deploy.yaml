name: Todo Project GitOps

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'todo-app/**'
      - 'todo-backend/**'
      - 'broadcaster/**'
      - 'environments/**'
      - '.github/workflows/todo-deploy.yaml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to deploy to production
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: todo-release
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=production" >> "$GITHUB_ENV"
            git checkout --detach "$SHA"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=production" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=main" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and publish
        shell: bash
        run: |
          PREFIX="$REGISTRY/$PROJECT_ID/$REPOSITORY"

          for APP in todo-app todo-backend broadcaster; do
            docker build -t "$PREFIX/$APP:$RELEASE_SHA" "./$APP"
            docker push "$PREFIX/$APP:$RELEASE_SHA"
          done

      - name: Prepare GitOps branch
        shell: bash
        run: |
          git fetch origin "$TARGET_BRANCH"
          git switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "production" ]]; then
            git restore --source="$RELEASE_SHA" -- environments/
          fi

      - name: Update deployment images
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("environments/base/kustomization.yaml")
          text = p.read_text()
          sha = os.environ["RELEASE_SHA"]

          for name in ("todo-app", "todo-backend", "broadcaster"):
              pattern = (
                  rf'(- name: {name}\n'
                  rf'\s*newName: [^\n]+\n'
                  rf'\s*newTag: )("[^"]+"|\S+)'
              )
              text, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + f'"{sha}"',
                  text
              )
              if count != 1:
                  raise RuntimeError(f"Image not found: {name}")

          p.write_text(text)
          PY

      - name: Validate deployment
        shell: bash
        run: |
          kubectl kustomize environments/overlays/"$TARGET_BRANCH" > /dev/null

      - name: Commit deployment configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/

          if ! git diff --cached --quiet; then
            git commit -m "Release Todo images $RELEASE_SHA [skip ci]"
          fi

          git push origin "HEAD:$TARGET_BRANCH"
