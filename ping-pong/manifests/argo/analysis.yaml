apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: namespace-cpu
  namespace: exercises
spec:
  metrics:
    - name: namespace-cpu-usage
      initialDelay: 20s
      count: 1
      failureLimit: 0
      successCondition: result[0] <= 0.000001
      failureCondition: result[0] > 0.000001
      provider:
        prometheus:
          address: http://prom-prometheus-server.prometheus.svc.cluster.local
          query: |
            sum(
              rate(
                container_cpu_usage_seconds_total{
                  namespace="exercises",
                  container!="",
                  image!=""
                }[5m]
              )
            )
