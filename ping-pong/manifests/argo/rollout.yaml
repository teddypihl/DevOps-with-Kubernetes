apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong-canary
  namespace: exercises
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ping-pong-canary
  template:
    metadata:
      labels:
        app: ping-pong-canary
    spec:
      containers:
        - name: ping-pong
          image: europe-north1-docker.pkg.dev/total-amulet-514412-b7/dwk-images/ping-pong:3.4
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: postgres-svc
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: pingpong
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ping-pong-db-secret
                  key: POSTGRES_PASSWORD
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: namespace-cpu
