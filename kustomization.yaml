apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project

resources:
  - todo-app/manifests/configmap.yaml
  - todo-app/manifests/deployment.yaml
  - todo-app/manifests/service.yaml
  - todo-app/manifests/image-pvc.yaml
  - todo-backend/manifests/configmap.yaml
  - todo-backend/manifests/deployment.yaml
  - todo-backend/manifests/service.yaml
  - todo-backend/manifests/gke/postgres.yaml
  - todo-backend/manifests/cronjob.yaml

images:
  - name: todo-app
    newName: europe-north1-docker.pkg.dev/total-amulet-514412-b7/dwk-images/todo-app
    newTag: "3.5"
  - name: todo-backend
    newName: europe-north1-docker.pkg.dev/total-amulet-514412-b7/dwk-images/todo-backend
    newTag: "3.5"
