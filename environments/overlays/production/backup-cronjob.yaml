apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-database-backup
  namespace: project
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: todo-backup
          restartPolicy: Never

          volumes:
            - name: backup
              emptyDir: {}

          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: todo-db-secret
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  FILE="/backup/todos-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump \
                    -h todo-postgres-svc \
                    -U postgres \
                    -d todos \
                    -Fc \
                    -f "$FILE"
                  echo "Database backup created: $FILE"
              volumeMounts:
                - name: backup
                  mountPath: /backup

          containers:
            - name: upload-to-gcs
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  gcloud storage cp /backup/*.dump \
                    gs://dwk-todo-backups-total-amulet-514412-b7/
                  echo "Backup uploaded successfully"
              volumeMounts:
                - name: backup
                  mountPath: /backup
